# Description: CI gates for every push and pull request.
# Description: The accuracy repro is a required gate; green tests alone did not catch the summary drift.

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Cross-layer accuracy
        run: npm run check:accuracy
